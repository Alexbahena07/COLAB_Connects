name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: jobmatch

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` succeeds without touching a real database
      # or mail provider. Nothing in the build should connect to these.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-dummy-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobmatch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build:ci
